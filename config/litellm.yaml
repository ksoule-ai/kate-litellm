# LiteLLM proxy config. Secrets are never written here: reference them as
# os.environ/NAME and set the value in .env.

model_list:
  # Wildcard routes: call any model as "<provider>/<model>" without listing it.

  # e.g. openrouter/anthropic/claude-sonnet-4.5
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY

  # e.g. replicate/meta/meta-llama-3-8b-instruct
  # Replicate deployments: replicate/deployments/<user>/<deployment-name>
  - model_name: "replicate/*"
    litellm_params:
      model: "replicate/*"
      api_key: os.environ/REPLICATE_API_KEY

  # Hugging Face serverless Inference Providers,
  # huggingface/<inference-provider>/<org>/<model>
  - model_name: "huggingface/*"
    litellm_params:
      model: "huggingface/*"
      api_key: os.environ/HF_TOKEN

  # Ollama running on this Mac (start it with `ollama serve` or the Ollama app),
  # e.g. ollama/llama3.2. Any model you have pulled works; no key needed.
  - model_name: "ollama/*"
    litellm_params:
      model: "ollama_chat/*"
      api_base: http://host.docker.internal:11434

  # Hugging Face dedicated Inference Endpoints: one entry per endpoint, because
  # each has its own URL. model_name is what clients call it. The model line
  # depends on the container the endpoint was deployed with:
  #   vLLM: hosted_vllm/<id from the endpoint's /v1/models>, api_base ending /v1
  #   TGI:  huggingface/tgi, api_base ending /v1/

  # ibm-granite/granite-switch-4.1-3b-preview
  - model_name: hf/ibm-granite/granite-switch-4.1-3b-preview
    litellm_params:
      model: hosted_vllm/ibm-granite/granite-switch-4.1-3b-preview
      api_base: https://mbimbmuaa2tq684u.endpoints.huggingface.cloud/v1
      api_key: os.environ/HF_TOKEN

  # ibm-granite/granite-4.1-8b
  - model_name: hf/ibm-granite/granite-4.1-8b
    litellm_params:
      model: hosted_vllm/ibm-granite/granite-4.1-8b
      api_base: https://nltr8ll7t7v2xvnw.endpoints.huggingface.cloud/v1
      api_key: os.environ/HF_TOKEN

litellm_settings:
  # Silently drop request params a given provider doesn't support, so one
  # client can talk to every provider.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Allow adding/editing models from the UI in addition to this file.
  store_model_in_db: true
  # Keep full request/response bodies in the log viewer, not just metadata.
  store_prompts_in_spend_logs: true
  # Delete request logs older than a week; the cleanup job runs daily.
  # Daily spend aggregates are stored separately and are not affected.
  maximum_spend_logs_retention_period: "7d"
  maximum_spend_logs_retention_interval: "1d"
  # Routes LiteLLM has no native support for, forwarded as is to the provider.
  pass_through_endpoints:
    # OpenRouter's System One API (TypeSafe Jev request/response shapes); the
    # chat routes reject these models. POST /v1/systemone with model "jev-1.13".
    - path: "/v1/systemone"
      target: "https://openrouter.ai/api/v1/systemone"
      headers:
        Authorization: "Bearer os.environ/OPENROUTER_API_KEY"
        content-type: application/json
      auth: true   # require a LiteLLM key, like every other route
